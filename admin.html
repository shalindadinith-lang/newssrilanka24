<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Panel | newssrilanka24.com.lk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-topbar">
        <div class="admin-logo">
            <i class="fas fa-newspaper"></i> <span>News Sri Lanka 24</span> <em>Admin</em>
        </div>
        <div class="admin-user" id="adminUserInfo" style="display:none;">
            <span id="adminEmail"></span>
            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-wrap">
        <div class="login-card">
            <div class="login-icon"><i class="fas fa-lock"></i></div>
            <h2>Admin Login</h2>
            <p class="login-sub">Supabase Authentication</p>
            <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
            <div id="loginError" class="login-error"></div>
            <button id="loginBtn" class="btn btn-primary btn-block">Login</button>
        </div>
    </div>

    <!-- Not authorized -->
    <div id="notAuthorized" class="login-wrap" style="display:none;">
        <div class="login-card">
            <div class="login-icon"><i class="fas fa-ban"></i></div>
            <h2>Access Denied</h2>
            <p id="notAuthorizedMsg">ඔබට admin ප්‍රවේශයක් නැත.</p>
            <button id="backToLoginBtn" class="btn btn-secondary btn-block">Back to Login</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="admin-dashboard" style="display:none;">
        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="list"><i class="fas fa-list"></i> News List</button>
            <button class="tab-btn" data-tab="editor"><i class="fas fa-plus-circle"></i> Add News</button>
        </div>

        <!-- News List -->
        <div id="tab-list" class="tab-panel">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Language</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Published Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="newsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- News Editor -->
        <div id="tab-editor" class="tab-panel" style="display:none;">
            <div class="editor-card">
                <h2 id="newsFormTitle"><i class="fas fa-edit"></i> Add News</h2>
                <form id="newsForm">
                    <input type="hidden" id="docId">

                    <div class="form-row">
                        <div class="form-group">
                            <label>Language</label>
                            <select id="newsLanguage">
                                <option value="si">සිංහල (Sinhala)</option>
                                <option value="en">English</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="newsCategory">
                                <option value="general">General</option>
                                <option value="sri-lanka">Sri Lanka</option>
                                <option value="world">World</option>
                                <option value="technology">Technology</option>
                                <option value="sports">Sports</option>
                                <option value="business">Business</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="education">Education</option>
                                <option value="health">Health</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="newsTitle" placeholder="News title...">
                    </div>

                    <div class="form-group">
                        <label>Short Description</label>
                        <textarea id="newsShortDescription" rows="2" placeholder="Short summary..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Full News Content</label>
                        <textarea id="newsContent" rows="8" placeholder="Full article content..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Author</label>
                            <input type="text" id="newsAuthor" value="News Sri Lanka 24">
                        </div>
                        <div class="form-group">
                            <label>Publish Date</label>
                            <input type="datetime-local" id="newsPublishedAt">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Image (Supabase Storage)</label>
                        <input type="file" id="newsImage" accept="image/*">
                        <div id="uploadError" class="upload-error"></div>
                        <img id="imagePreview" class="image-preview" style="display:none;" alt="Preview">
                    </div>

                    <div class="form-row">
                        <label class="checkbox-label"><input type="checkbox" id="newsBreaking"> Breaking News</label>
                        <label class="checkbox-label"><input type="checkbox" id="newsFeatured"> Featured News</label>
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="newsStatus">
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="saveDraftBtn" class="btn btn-secondary"><i class="fas fa-save"></i> Save Draft</button>
                        <button type="button" id="publishBtn" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Publish</button>
                        <button type="button" id="previewBtn" class="btn btn-info"><i class="fas fa-eye"></i> Preview</button>
                        <button type="button" id="clearBtn" class="btn btn-danger"><i class="fas fa-eraser"></i> Clear</button>
                    </div>
                    <div id="saveStatus" style="display:none;"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- View Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeViewModal">&times;</span>
            <div id="viewBody"></div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closePreviewModal">&times;</span>
            <div id="previewBody"></div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
