    <style>

    </footer>

    <div id="newsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModalBtn">&times;</span>
            <div id="modalBody"></div>
        </div>

    <script>
        // RSS සංග්‍රහ
        const RSS_FEEDS = [
            'https://api.rss2json.com/v1/api.json?rss_url=https://www.lankacnews.com/feeds/posts/default?alt=rss',
           // 'https://api.rss2json.com/v1/api.json?rss_url=https://www.adaderana.lk/rss.php'
            // වෙනත් feeds...
        ];

        let allArticles = [];
        let filteredArticles = [];
        let currentCategory = 'all';
        let searchTerm = '';

        // --- Piuma News Default Meta Values ---
        const DEFAULT_TITLE = 'Piuma News | පුවත්';
        const DEFAULT_DESCRIPTION = 'සිංහල පුවත් සාරාංශ, ක්‍රීඩා, තාක්ෂණය, ව්‍යාපාරික පුවත් එකම තැනකින්.';
        const DEFAULT_OG_TITLE = 'Piuma News';
        const DEFAULT_OG_DESC = 'සැබෑ කාලීන සිංහල පුවත් සාරාංශ.';
        const DEFAULT_OG_IMAGE = 'https://yourdomain.com/logo.png';
        const DEFAULT_OG_URL = 'https://yourdomain.com/';
        const DEFAULT_TWITTER_TITLE = 'Piuma News';
        const DEFAULT_TWITTER_DESC = 'සිංහල පුවත් එකතුව.';
        const DEFAULT_TWITTER_IMAGE = 'https://yourdomain.com/logo.png';

        // --- Dark Mode ---
        const darkToggle = document.getElementById('darkModeToggle');
        if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        darkToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        });

        // ==================== බහු RSS පූරණය ====================
        async function fetchAllFeeds() {
            let allItems = [];
            for (let feedUrl of RSS_FEEDS) {
                try {
                    const response = await fetch(feedUrl);
                    const data = await response.json();
                    if (data.items) {
                        allItems = allItems.concat(data.items);
                    }
                } catch(e) { console.warn('Feed fetch failed:', feedUrl); }
            }
            const uniqueMap = new Map();
            allItems.forEach(item => {
                if (!uniqueMap.has(item.link)) uniqueMap.set(item.link, item);
            });
            return Array.from(uniqueMap.values());
        }

        async function fetchNews() {
            try {
                const items = await fetchAllFeeds();
                allArticles = items.map(item => ({
                    title: item.title,
                    link: item.link,
                    description: item.description ? item.description.replace(/<[^>]*>/g, '') : '',
                    thumbnail: item.thumbnail || 'https://via.placeholder.com/800x400?text=News',
                    pubDate: item.pubDate,
                    category: detectCategory(item.title + ' ' + (item.description || ''))
                }));
                allArticles.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
                filteredArticles = [...allArticles];
                renderSlider();
                renderNewsGrid();
                renderBreakingTicker();
                handleHash();
            } catch(err) {
                console.error(err);
                document.getElementById('newsGrid').innerHTML = '<div style="text-align:center; padding:40px;">පුවත් ලබාගැනීම අසාර්ථකයි.</div>';
            }
        }

        function detectCategory(text) {
            const lower = text.toLowerCase();
            if(lower.includes('ටෙක්') || lower.includes('තාක්ෂණ')) return 'technology';
            if(lower.includes('ක්‍රීඩා') || lower.includes('තරග')) return 'sports';
            if(lower.includes('ව්‍යාපාර') || lower.includes('ආර්ථික')) return 'business';
            if(lower.includes('ලෝක') || lower.includes('විදෙස්')) return 'world';
            return 'general';
        }

        function renderSlider() {
            const top5 = allArticles.slice(0,5);
            let html = '';
            top5.forEach((item, idx) => {
                let img = item.thumbnail.replace('s72', 's1200');
                html += `<div class="slide" style="display:${idx===0?'block':'none'}">
                            <img src="${img}" alt="slide">
                            <div class="slide-caption">${item.title}</div>
                        </div>`;
            });
            document.getElementById('sliderContainer').innerHTML = html;
            startSlider();
        }

        function startSlider() {
            let slides = document.querySelectorAll('.slide');
            let idx = 0;
            setInterval(() => {
                if (slides.length === 0) return;
                slides[idx].style.display = 'none';
                idx = (idx+1) % slides.length;
                slides[idx].style.display = 'block';
            }, 5000);
        }

        function renderBreakingTicker() {
            let ticker = allArticles.slice(0,10).map(a => a.title).join(' • ');
            document.getElementById('breakingMarquee').innerHTML = ticker;
        }

        async function renderNewsGrid() {
            let articlesToShow = filteredArticles;
            if(currentCategory !== 'all') articlesToShow = filteredArticles.filter(a => a.category === currentCategory);
            if(searchTerm) {
                articlesToShow = articlesToShow.filter(a => 
                    a.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    a.description.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';

            for(let article of articlesToShow) {
                const card = document.createElement('div');
                card.className = 'news-card';
                const imgUrl = article.thumbnail.replace('s72', 's600');
                const date = new Date(article.pubDate).toLocaleDateString('si-LK');

                card.innerHTML = `
                    <img src="${imgUrl}" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">${article.title}</div>
                        <div class="card-meta">
                            <span><i class="far fa-calendar"></i> ${date}</span>
                        </div>
                        <div class="summary-preview" style="margin-top:12px; color:#64748b; font-size:0.85rem;">
                            ${article.description.substring(0, 150)}...
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    window.location.hash = 'article=' + encodeURIComponent(article.link);
                    openModal(article);
                });
                grid.appendChild(card);
            }
        }

        // --- Hash Handling ---
        function handleHash() {
            const hash = window.location.hash.substring(1);
            if (hash.startsWith('article=')) {
                const encodedUrl = hash.substring('article='.length);
                const link = decodeURIComponent(encodedUrl);
                const article = allArticles.find(a => a.link === link);
                if (article) {
                    openModal(article);
                }
            } else {
                resetMetaTags();
            }
        }
        window.addEventListener('hashchange', handleHash);

        // --- Reset Meta Tags ---
        function resetMetaTags() {
            document.title = DEFAULT_TITLE;
            setMeta('description', DEFAULT_DESCRIPTION);
            setMeta('og:title', DEFAULT_OG_TITLE);
            setMeta('og:description', DEFAULT_OG_DESC);
            setMeta('og:image', DEFAULT_OG_IMAGE);
            setMeta('og:url', DEFAULT_OG_URL);
            setMeta('twitter:title', DEFAULT_TWITTER_TITLE);
            setMeta('twitter:description', DEFAULT_TWITTER_DESC);
            setMeta('twitter:image', DEFAULT_TWITTER_IMAGE);
            removeArticleStructuredData();
        }

        function setMeta(property, content) {
            let selector;
            if (property.startsWith('og:')) {
                selector = `meta[property="${property}"]`;
            } else if (property.startsWith('twitter:')) {
                selector = `meta[name="${property}"]`;
            } else {
                selector = `meta[name="${property}"]`;
            }
            const element = document.querySelector(selector);
            if (element) element.setAttribute('content', content);
        }

        // --- Article Structured Data ---
        function addArticleStructuredData(article) {
            removeArticleStructuredData();
            const ldJson = {
                "@context": "https://schema.org",
                "@type": "NewsArticle",
                "headline": article.title,
                "description": article.description,
                "image": article.thumbnail.replace('s72','s800'),
                "datePublished": article.pubDate,
                "url": window.location.href,
                "author": { "@type": "Organization", "name": "Piuma News" },
                "publisher": {
                    "@type": "Organization",
                    "name": "Piuma News",
                    "logo": { "@type": "ImageObject", "url": "https://yourdomain.com/logo.png" }
                }
            };
            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.id = 'article-ld';
            script.textContent = JSON.stringify(ldJson);
            document.head.appendChild(script);
        }

        function removeArticleStructuredData() {
            const existing = document.getElementById('article-ld');
            if (existing) existing.remove();
        }

        // ==================== AI සාරාංශය (Pollinations.ai) ====================
        async function getAISummary(text, callback) {
            const shortText = text.substring(0, 800);
            const prompt = `කෙටියෙන් සිංහලෙන් සාරාංශ කරන්න: ${shortText}`;
            const url = 'https://text.pollinations.ai/' + encodeURIComponent(prompt);
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    callback('AI සේවාව තාවකාලිකව ලබාගත නොහැක.');
                    return;
                }
                const summary = await response.text();
                callback(summary.trim());
            } catch(e) {
                callback('AI සාරාංශය ලබාගැනීමට අපොහොසත් විය.');
            }
        }

        // ==================== Modal හා Share ====================
        function openModal(article) {
            const modal = document.getElementById('newsModal');
            const modalBody = document.getElementById('modalBody');

            const shareUrl = article.link;
            const shareTitle = article.title;
            const encodedUrl = encodeURIComponent(shareUrl);
            const encodedTitle = encodeURIComponent(shareTitle);

            modalBody.innerHTML = `
                <h2 style="color:var(--primary); margin-bottom:15px;">${shareTitle}</h2>
                <img src="${article.thumbnail.replace('s72','s800')}" style="width:100%; border-radius:20px; margin:15px 0;" onerror="this.src='https://via.placeholder.com/800x400'">
                <p><strong>විස්තරය:</strong><br>${article.description}</p>
                
                <!-- AI සාරාංශ බොත්තම -->
                <div style="margin-top:15px;">
                    <button id="aiSummaryBtn" class="ai-summary-btn">
                        <i class="fas fa-robot"></i> AI සාරාංශය
                    </button>
                </div>
                <div id="aiSummaryContainer"></div>

                <!-- Share Buttons -->
                <div class="share-buttons">
                    <span style="margin-right:8px; font-weight:600;">📤 Share:</span>
                    <button class="share-btn" id="shareWhatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                    <button class="share-btn" id="shareTwitter"><i class="fab fa-twitter"></i> Twitter</button>
                    <button class="share-btn" id="shareTelegram"><i class="fab fa-telegram-plane"></i> Telegram</button>
                    <button class="share-btn" id="shareCopy"><i class="fas fa-copy"></i> Copy Link</button>
                </div>

                <div class="modal-buttons" style="margin-top:20px;">
                    <a href="${article.link}" target="_blank" style="background:var(--primary); color:white; padding:12px 24px; border-radius:40px; text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
                        <i class="fas fa-external-link-alt"></i> මුල් පුවත කියවන්න
                    </a>
                </div>
            `;
            modal.style.display = 'flex';

            // --- Share handlers ---
            document.getElementById('shareWhatsapp').addEventListener('click', () => {
                window.open(`https://wa.me/?text=${encodedTitle}%20${encodedUrl}`, '_blank');
            });
            document.getElementById('shareTwitter').addEventListener('click', () => {
                window.open(`https://twitter.com/intent/tweet?text=${encodedTitle}&url=${encodedUrl}`, '_blank');
            });
            document.getElementById('shareTelegram').addEventListener('click', () => {
                window.open(`https://t.me/share/url?url=${encodedUrl}&text=${encodedTitle}`, '_blank');
            });
            document.getElementById('shareCopy').addEventListener('click', () => {
                navigator.clipboard.writeText(shareUrl).then(() => alert('ලින්ක් එක copy කළා!'));
            });

            // --- AI summary button ---
            document.getElementById('aiSummaryBtn').addEventListener('click', function() {
                const btn = this;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> සාරාංශනය වෙමින්...';
                getAISummary(article.description, (summary) => {
                    document.getElementById('aiSummaryContainer').innerHTML = `
                        <div class="ai-summary-box">
                            <strong>🤖 AI සාරාංශය:</strong>
                            <p>${summary}</p>
                        </div>
                    `;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-robot"></i> AI සාරාංශය';
                });
            });

            // --- Meta Update (SEO) ---
            document.title = article.title + ' | Piuma News';
            setMeta('description', article.description.substring(0, 160));
            setMeta('og:title', article.title);
            setMeta('og:description', article.description.substring(0, 200));
            setMeta('og:image', article.thumbnail.replace('s72','s800'));
            setMeta('og:url', window.location.href);
            setMeta('twitter:title', article.title);
            setMeta('twitter:description', article.description.substring(0, 200));
            setMeta('twitter:image', article.thumbnail.replace('s72','s800'));
            addArticleStructuredData(article);
        }

        // --- Filters ---
        function applyFilters() { renderNewsGrid(); }

        document.getElementById('searchBtn').addEventListener('click', () => {
            searchTerm = document.getElementById('searchInput').value;
            applyFilters();
        });
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                searchTerm = e.target.value;
                applyFilters();
            }
        });
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.getAttribute('data-cat');
                applyFilters();
            });
        });

        // --- Modal Close ---
        function closeModalAndReset() {
            document.getElementById('newsModal').style.display = 'none';
            window.location.hash = '';
            resetMetaTags();
        }
        document.getElementById('closeModalBtn').addEventListener('click', closeModalAndReset);
        window.addEventListener('click', (e) => {
            if(e.target === document.getElementById('newsModal')) {
                closeModalAndReset();
            }
        });

        // Initialize
        fetchNews();
    </script>
</body>
</html>
