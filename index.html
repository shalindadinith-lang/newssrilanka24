        function makeSlug(title, salt) {
            const base = String(title || 'news').toLowerCase().replace(/[^a-z0-9\u0D80-\u0DFF]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
            let h = 0;
            const s = String(salt || '');
            for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
            const hash = Math.abs(h).toString(36).slice(0, 5);
            return (base || 'news') + '-' + hash;
        }

        function getArticleSlug(article) {
            if (article && article.slug) return article.slug;
            const title = (article && article.title) || 'news';
            const salt = (article && (article.originalLink || article.link)) || title;
            return makeSlug(title, salt);
        }

        function getArticlePath(article) {
            return '/article/' + getArticleSlug(article) + '/';
        }

        function getArticleHref(article) {
            if (article && article.source === 'rss' && article.originalLink) return article.originalLink;
            return getArticlePath(article);
        }

        function formatThumb(url, size) {
            if (!url) return 'https://via.placeholder.com/800x400?text=News';
            if (url.indexOf('s72') !== -1) return url.replace('s72', size);
            return url;
        }

        // ==================== බහු RSS පූරණය (preserved) ====================
        async function fetchAllFeeds() {
            let allItems = [];
            for (let feedUrl of RSS_FEEDS) {
                try {
                    const response = await fetch(feedUrl);
                    const data = await response.json();
                    if (data.items) {
                        allItems = allItems.concat(data.items);
                    }
                } catch(e) { console.warn('Feed fetch failed:', feedUrl); }
            }
            const uniqueMap = new Map();
            allItems.forEach(item => {
                if (!uniqueMap.has(item.link)) uniqueMap.set(item.link, item);
            });
            return Array.from(uniqueMap.values());
        }

        async function fetchNews() {
            let rssArticles = [];
            let supabaseArticles = [];

            // RSS fail වුණොත් Supabase news පෙන්වයි.
            try {
                rssArticles = await fetchAllFeeds();
            } catch(e) {
                console.warn('RSS feeds failed:', e);
            }

            // Supabase fail වුණොත් RSS news පෙන්වයි.
            // Dynamic import නිසා Supabase CDN එක fail වුණත් RSS system එකට බලපාන්නේ නැහැ.
            try {
                const sbModule = await import('/supabase-news.js');
                supabaseArticles = await sbModule.fetchSupabaseNews();
            } catch(e) {
                console.warn('Supabase news failed:', e);
            }

            const rssMapped = rssArticles.map(item => {
                const slug = makeSlug(item.title, item.link);
                return {
                    title: item.title,
                    link: '/article/' + slug + '/',
                    slug: slug,
                    originalLink: item.link,
                    description: item.description ? item.description.replace(/<[^>]*>/g, '') : '',
                    thumbnail: item.thumbnail || 'https://via.placeholder.com/800x400?text=News',
                    pubDate: item.pubDate,
                    category: detectCategory(item.title + ' ' + (item.description || '')),
                    language: 'si',
                    source: 'rss',
                    content: item.content || ''
                };
            });

            allArticles = [...supabaseArticles, ...rssMapped];

            // Normalize: every article must carry a valid clean-URL slug.
            allArticles = allArticles.map(a => {
                const slug = getArticleSlug(a);
                return Object.assign({}, a, { slug: slug, link: '/article/' + slug + '/' });
            });

            if (allArticles.length === 0) {
                document.getElementById('newsGrid').innerHTML = '<div style="text-align:center; padding:40px;">පුවත් ලබාගැනීම අසාර්ථකයි.</div>';
                return;
            }

            allArticles.sort((a, b) => {
                return new Date(b.pubDate) - new Date(a.pubDate);
            });
            filteredArticles = [...allArticles];
            renderSlider();
            renderNewsGrid();
            renderBreakingTicker();
            handleRoute();
        }

        function detectCategory(text) {
            const lower = String(text || '').toLowerCase();
            if(lower.includes('ටෙක්') || lower.includes('තාක්ෂණ') || lower.includes('technology') || lower.includes('smartphone') || lower.includes('phone') || lower.includes('app')) return 'technology';
            if(lower.includes('ක්‍රීඩා') || lower.includes('තරග') || lower.includes('sports') || lower.includes('cricket')) return 'sports';
            if(lower.includes('ව්‍යාපාර') || lower.includes('ආර්ථික') || lower.includes('business') || lower.includes('economy') || lower.includes('market')) return 'business';
            if(lower.includes('ලෝක') || lower.includes('විදෙස්') || lower.includes('world') || lower.includes('international')) return 'world';
            if(lower.includes('සිනමා') || lower.includes('රංගන') || lower.includes('ගායන') || lower.includes('entertainment') || lower.includes('film')) return 'entertainment';
            if(lower.includes('අධ්‍යාපන') || lower.includes('පාසල්') || lower.includes('විශ්වවිද්‍යාල') || lower.includes('education')) return 'education';
            if(lower.includes('සෞඛ්‍ය') || lower.includes('රෝග') || lower.includes('health') || lower.includes('hospital')) return 'health';
            if(lower.includes('ශ්‍රී ලංකා') || lower.includes('ශ්‍රී ලංකාව') || lower.includes('sri lanka')) return 'sri-lanka';
            return 'general';
        }

        function renderSlider() {
            const featured = allArticles.filter(a => a.isFeatured);
            const topItems = [];
            const seen = new Set();
            for (const a of [...featured, ...allArticles]) {
                if (!seen.has(a.link)) {
                    seen.add(a.link);
                    topItems.push(a);
                }
                if (topItems.length >= 5) break;
            }
            let html = '';
            topItems.forEach((item, idx) => {
                const href = getArticleHref(item);
                html += `<a class="slide slide-link" href="${href}" style="display:${idx===0?'block':'none'}">
                            <img src="${formatThumb(item.thumbnail, 's1200')}" alt="${item.title}" width="1400" height="420" loading="${idx===0?'eager':'lazy'}" ${idx===0?'fetchpriority="high"':''}>
                            <div class="slide-caption">${item.title}</div>
                        </a>`;
            });
            const container = document.getElementById('sliderContainer');
            container.innerHTML = html;
            container.querySelectorAll('.slide-link').forEach((el, i) => {
                if (!topItems[i]) return;
                el.addEventListener('click', (e) => {
                    const article = topItems[i];
                    if (article.source === 'rss') return;
                    e.preventDefault();
                    const slug = getArticleSlug(article);
                    history.pushState({ slug: slug }, '', getArticlePath(article));
                    openModal(article);
                });
            });
            startSlider();
        }

        function startSlider() {
            let slides = document.querySelectorAll('.slide');
            let idx = 0;
            setInterval(() => {
                if (slides.length === 0) return;
                slides[idx].style.display = 'none';
                idx = (idx+1) % slides.length;
                slides[idx].style.display = 'block';
            }, 5000);
        }

        function renderBreakingTicker() {
            const breakingItems = allArticles.filter(a => a.isBreaking);
            const tickerItems = [];
            const seen = new Set();
            for (const a of [...breakingItems, ...allArticles]) {
                if (!seen.has(a.link)) {
                    seen.add(a.link);
                    tickerItems.push(a);
                }
                if (tickerItems.length >= 15) break;
            }
            document.getElementById('breakingMarquee').innerHTML = tickerItems.map(a => {
                return `<a href="${getArticleHref(a)}">${a.title}</a>`;
            }).join(' • ');
        }

        async function renderNewsGrid() {
            let articlesToShow = filteredArticles;

            if(currentLanguage !== 'all') articlesToShow = articlesToShow.filter(a => (a.language || 'si') === currentLanguage);
            if(searchTerm) {
                articlesToShow = articlesToShow.filter(a => {
                    const haystack = ((a.title || '') + ' ' + (a.description || '') + ' ' + (a.content || '') + ' ' + (a.category || '')).toLowerCase();
                    return haystack.includes(searchTerm.toLowerCase());

            const grid = document.getElementById('newsGrid');

                card.innerHTML = `

                            ${(article.description || '').substring(0, 150)}...

        // --- Clean URL Routing ---
        function showHomeSurface(visible) {
            const notFound = document.getElementById('articleNotFound');
            const grid = document.getElementById('newsGrid');
            const slider = document.getElementById('sliderContainer');
            if (notFound) notFound.style.display = visible ? 'none' : 'block';
            if (grid) grid.style.display = visible ? '' : 'none';
            if (slider) slider.style.display = visible ? '' : 'none';
        }

        function handleRoute() {
            const path = window.location.pathname;
            if (path.startsWith('/article/')) {
                const slug = path.replace(/^\/article\//, '').replace(/\/+$/, '');
                const article = allArticles.find(a => a.slug === slug);
                if (article) {
                    showHomeSurface(true);
                    openModal(article);
                    return;
                }
                document.getElementById('newsModal').style.display = 'none';
                showHomeSurface(false);
                document.title = 'පුවත හමු නොවීය | News Sri Lanka 24';
                setMeta('description', 'ඔබ සොයන පුවත newssrilanka24.com.lk හි නැත.');
                setMeta('robots', 'noindex, follow');
                return;
            }
            // Legacy #article=... hashes → resolve to new clean URL
            const hash = window.location.hash;
            if (hash.startsWith('#article=')) {
                let link = '';
                try { link = decodeURIComponent(hash.slice('#article='.length)); } catch(_) { link = ''; }
                const article = allArticles.find(a => {
                    if (a.originalLink === link || a.link === link) return true;
                    if (link.indexOf('#supabase-') === 0 && a.id && link === '#supabase-' + a.id) return true;
                    return false;
                });
                if (article && article.slug) {
                    history.replaceState({}, '', '/article/' + article.slug);
                    openModal(article);
                    return;
                }
            }
            document.getElementById('newsModal').style.display = 'none';
            resetMetaTags();
        }
        window.addEventListener('popstate', handleRoute);

        // --- Reset Meta Tags ---
        function resetMetaTags() {
            document.title = DEFAULT_TITLE;
            setMeta('description', DEFAULT_DESCRIPTION);
            setMeta('robots', 'index, follow');
            setMeta('og:title', DEFAULT_OG_TITLE);
            setMeta('og:description', DEFAULT_OG_DESC);
            setMeta('og:image', DEFAULT_OG_IMAGE);
            setMeta('og:url', DEFAULT_OG_URL);
            setMeta('og:type', 'website');
            setMeta('twitter:title', DEFAULT_TWITTER_TITLE);
            setMeta('twitter:description', DEFAULT_TWITTER_DESC);
            setMeta('twitter:image', DEFAULT_TWITTER_IMAGE);
            setCanonical(DEFAULT_OG_URL);
            removeArticleStructuredData();
            showHomeSurface(true);
        }

        function setCanonical(url) {
            let el = document.querySelector('link[rel="canonical"]');
            if (el) { el.setAttribute('href', url); return; }
            el = document.createElement('link');
            el.rel = 'canonical';
            el.href = url;
            document.head.appendChild(el);
        }

        function setMeta(property, content) {
            let selector;
            if (property.startsWith('og:')) {
                selector = `meta[property="${property}"]`;
            } else if (property.startsWith('twitter:')) {
                selector = `meta[name="${property}"]`;
            } else {
                selector = `meta[name="${property}"]`;
            }
            const element = document.querySelector(selector);
            if (element) element.setAttribute('content', content);
        }

        // --- Article Structured Data ---
        function addArticleStructuredData(article, articleUrl) {
            removeArticleStructuredData();
            const ldJson = {
                "@context": "https://schema.org",
                "@type": "NewsArticle",
                "headline": article.title,
                "description": article.description,
                "image": formatThumb(article.thumbnail, 's800'),
                "datePublished": article.pubDate,
                "dateModified": article.pubDate,
                "url": articleUrl || ("https://newssrilanka24.com.lk/article/" + article.slug + "/"),
                "mainEntityOfPage": {
                    "@type": "WebPage",
                    "@id": articleUrl || ("https://newssrilanka24.com.lk/article/" + article.slug + "/")
                },
                "author": { "@type": "Organization", "name": article.author || "News Sri Lanka 24" },
                "publisher": {
                    "@type": "Organization",
                    "name": "News Sri Lanka 24",
                    "logo": { "@type": "ImageObject", "url": "https://newssrilanka24.com.lk/logo.png" }
                },
                "articleSection": CATEGORY_LABELS[article.category] || article.category || "General",
                "inLanguage": article.language === "en" ? "en" : "si"
            };
            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.id = 'article-ld';
            script.textContent = JSON.stringify(ldJson);
            document.head.appendChild(script);
        }

        function removeArticleStructuredData() {
            const existing = document.getElementById('article-ld');
            if (existing) existing.remove();
        }

        // ==================== AI සාරාංශය (Pollinations.ai) ====================
        async function getAISummary(text, callback) {
            const shortText = String(text || '').substring(0, 800);
            const prompt = `කෙටියෙන් සිංහලෙන් සාරාංශ කරන්න: ${shortText}`;
            const url = 'https://text.pollinations.ai/' + encodeURIComponent(prompt);
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    callback('AI සේවාව තාවකාලිකව ලබාගත නොහැක.');
                    return;
                }
                const summary = await response.text();
                callback(summary.trim());
            } catch(e) {
                callback('AI සාරාංශය ලබාගැනීමට අපොහොසත් විය.');
            }
        }

                const btn = this;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> සාරාංශනය වෙමින්...';
                const summaryInput = article.content || article.description || '';
                getAISummary(summaryInput, (summary) => {
                    document.getElementById('aiSummaryContainer').innerHTML = `
                        <div class="ai-summary-box">
                            <strong>🤖 AI සාරාංශය:</strong>
                            <p>${summary}</p>
                        </div>
                    `;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-robot"></i> AI සාරාංශය';
                });
            });

            // --- Meta Update (SEO) ---
            const articleUrl = SITE + '/article/' + articleSlug + '/';
            document.title = article.title + ' | ' + SITE_NAME;
            setMeta('description', (article.description || '').substring(0, 160));
            setMeta('og:title', article.title);
            setMeta('og:description', (article.description || '').substring(0, 200));
            setMeta('og:image', formatThumb(article.thumbnail, 's800'));
            setMeta('og:url', articleUrl);
            setMeta('og:type', 'article');
            setMeta('twitter:title', article.title);
            setMeta('twitter:description', (article.description || '').substring(0, 200));
            setMeta('twitter:image', formatThumb(article.thumbnail, 's800'));
            setCanonical(articleUrl);
            addArticleStructuredData(article, articleUrl);
        }

        // --- Filters ---
        function applyFilters() { renderNewsGrid(); }

        document.getElementById('searchBtn').addEventListener('click', () => {
            searchTerm = document.getElementById('searchInput').value;
            applyFilters();
        });
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                searchTerm = e.target.value;
                applyFilters();
            }
        });
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.getAttribute('data-cat');
                applyFilters();
            });
        });
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLanguage = btn.getAttribute('data-lang');
                applyFilters();
            });
        });

        // --- Modal Close ---
        function closeModalAndReset() {
            history.pushState({}, '', '/');
            document.getElementById('newsModal').style.display = 'none';
            resetMetaTags();
        }
        document.getElementById('closeModalBtn').addEventListener('click', closeModalAndReset);
        window.addEventListener('click', (e) => {
            if(e.target === document.getElementById('newsModal')) {
                closeModalAndReset();
            }
        });

        // Initialize
        fetchNews();
    </script>
</body>
</html>
