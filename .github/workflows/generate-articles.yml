name: Generate static article pages

on:
  push:
    branches: [main]
    paths-ignore: ['article/**', 'sitemap.xml']
  workflow_dispatch:
  # Forward-compatible: a secure server-side webhook (e.g. Supabase Edge
  # Function holding a GitHub PAT) can POST a repository_dispatch event to
  # trigger an instant rebuild. Requires no code change when wired up.
  repository_dispatch:
    types: [generate-articles]
  schedule:
    # Permanent automatic regeneration: any article published in Supabase is
    # turned into a static /article/{slug}/ page + sitemap entry within ~5
    # minutes (GitHub's minimum schedule interval) — no manual build needed.
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate static article pages
        run: node build-static.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article sitemap.xml
          git diff --cached --quiet || (git commit -m "chore: regenerate article pages and sitemap" && git push)