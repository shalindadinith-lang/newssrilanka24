# Reference configuration for nginx hosts.
# Place inside your server block.
# GitHub Pages already redirects HTTP→HTTPS and www→apex.

error_page 404 /404.html;

location = /robots.txt {
    default_type text/plain;
    charset utf-8;
}

location = /sitemap.xml {
    default_type application/xml;
    charset utf-8;
}

location / {
    index index.html;
    try_files $uri $uri/ =404;
}
